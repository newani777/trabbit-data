name: bake
# 매일 새벽 굽는다. 21:00 UTC = 06:00 KST — 기상청 단기예보가 05시에 갱신되고,
# 수출입은행 환율은 영업일 11시경이라 전날 고시를 싣게 된다(주말엔 마지막 고시).
on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:        # 손으로도 돌릴 수 있게
# 결과를 이 저장소에 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    # K-pop 은 KOPIS 인증키가 비밀값에 있을 때만 돈다. 없으면 그 단계만 건너뛴다.
    env:
      KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 인증키는 저장소 비밀값에만 있다. 로그에 찍히지 않는다.
      # 하루 요약 + 시간대별(36시간) + 미세먼지 예보(에어코리아). 미세먼지는
      # 공공데이터포털 활용신청 전이면 그 칸만 건너뛴다(2026-09-11).
      - name: 날씨 (기상청 단기예보)
        env:
          OPENDATA_API_KEY: ${{ secrets.OPENDATA_API_KEY }}
        run: python scripts/fetch_weather.py --out weather.json
      # 환율은 주말·공휴일에 빈 배열이 온다. 스크립트가 5일까지 거슬러
      # 마지막 고시를 찾지만, 그래도 실패하면 어제 파일을 그대로 둔다.
      - name: 환율 (한국수출입은행)
        continue-on-error: true
        env:
          EXIM_KEY: ${{ secrets.EXIM_KEY }}
        run: python scripts/fetch_rates.py --out rates.json
      # 이번 달·다음 달 서울 대중음악 공연(1,000석 이상). 월말에도 다음 달이
      # 보여야 계획을 세운다(2026-09-11). 실패해도 어제 파일을 그대로 둔다.
      - name: K-pop 공연 (KOPIS)
        if: ${{ env.KOPIS_KEY != '' }}
        continue-on-error: true
        run: python scripts/fetch_kpop_shows.py --out kpop_shows.json
      # 「이번 주 한국」 지난 정보 정리 — 끝난 행사(ends 다음 날)와 4주 지난 회차를
      # manifest 에서 내린다. 예전 버전 앱에서도 사라지게 하려면 여기서 지워야 한다
      # (광호님 2026-09-21). 규칙은 trabbit_app lib/data/card_feed.dart 와 같다.
      - name: 주간 카드 정리
        continue-on-error: true
        run: python scripts/prune_weekly_feed.py
      - name: 바뀐 것만 커밋
        run: |
          git config user.name  'trabbit-bot'
          git config user.email 'noreply@github.com'
          git add weather.json rates.json
          git add kpop_shows.json scripts/venue_scale.json 2>/dev/null || true
          git add -A weekly_feed
          git diff --cached --quiet && echo '바뀐 것 없음' && exit 0
          git commit -m "bake $(date -u +%Y-%m-%d)"
          git push
